name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
            arch: x64
            package_arch: amd64
            artifact_name: linux-amd64-installers
          - os: ubuntu-22.04-arm
            platform: Linux
            arch: ARM64
            package_arch: arm64
            artifact_name: linux-arm64-installers
          - os: windows-latest
            platform: Windows
            arch: x64
            package_arch: x64
            artifact_name: windows-x64-installers
          - os: windows-11-arm
            platform: Windows
            arch: ARM64
            package_arch: arm64
            artifact_name: windows-arm64-installers
          - os: macos-15
            platform: macOS
            arch: ARM64
            package_arch: arm64
            artifact_name: macos-arm64-installer
          - os: macos-15-intel
            platform: macOS
            arch: x64
            package_arch: x64
            artifact_name: macos-x64-installer

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate tag version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "zeedle" } | Select-Object -First 1).version
          if (-not $version) {
            throw "Could not read zeedle package version from Cargo.toml."
          }

          $tag = $env:GITHUB_REF_NAME
          if ($tag.EndsWith("-test", [System.StringComparison]::Ordinal)) {
            $tag = $tag.Substring(0, $tag.Length - "-test".Length)
          }
          if ($tag.StartsWith("v")) {
            $tag = $tag.Substring(1)
          }
          if ($tag -cne $version) {
            throw "Tag '$($env:GITHUB_REF_NAME)' does not match Cargo.toml version '$version'."
          }

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xvfb \
            xinput

      - name: Build release executable
        run: cargo build --release

      - name: Smoke test release executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a python3 - <<'PY'
          import subprocess
          import time

          process = subprocess.Popen(["target/release/zeedle"])
          time.sleep(5)
          exit_code = process.poll()
          if exit_code is not None:
              raise SystemExit(f"zeedle exited during startup with code {exit_code}")
          process.terminate()
          process.wait(timeout=10)
          PY
          else
            python3 - <<'PY'
          import subprocess
          import time

          process = subprocess.Popen(["target/release/zeedle"])
          time.sleep(5)
          exit_code = process.poll()
          if exit_code is not None:
              raise SystemExit(f"zeedle exited during startup with code {exit_code}")
          process.terminate()
          process.wait(timeout=10)
          PY
          fi

      - name: Smoke test release executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "target/release/zeedle.exe"
          $process = Start-Process -FilePath $executable -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "zeedle exited during startup with code $($process.ExitCode)"
          }
          $process.Kill()
          $process.WaitForExit()

      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZEEDLE_PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          ./packager/pack-nsis.ps1
          ./packager/pack-msi.ps1

      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: |
          bash packager/pack-deb.sh
          bash packager/pack-appimage.sh

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: bash packager/pack-dmg.sh

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/Zeedle_*_${{ matrix.package_arch }}-setup.exe
            target/release/Zeedle_*_${{ matrix.package_arch }}.msi
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/Zeedle_*.deb
            target/release/Zeedle_*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/Zeedle_*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: ${{ !endsWith(github.ref_name, '-test') }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Windows x64 installers
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-installers
          path: dist

      - name: Download Windows ARM64 installers
        uses: actions/download-artifact@v8
        with:
          name: windows-arm64-installers
          path: dist

      - name: Download Linux x64 installers
        uses: actions/download-artifact@v8
        with:
          name: linux-amd64-installers
          path: dist

      - name: Download Linux ARM64 installers
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-installers
          path: dist

      - name: Download macOS ARM64 installer
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-installer
          path: dist

      - name: Download macOS x64 installer
        uses: actions/download-artifact@v8
        with:
          name: macos-x64-installer
          path: dist

      - name: Verify all installers are present
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [[ "$count" -ne 10 ]]; then
            echo "Expected 10 installers, found $count" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
