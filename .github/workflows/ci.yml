name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: ARM64

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          mold-version: 3.0.0
          make-default: true

      - name: Verify mold linker
        run: |
          mold --version
          test "$(readlink -f /usr/bin/ld)" = "$(command -v mold)"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xinput

      - name: Build release executable
        run: cargo build --locked --release

      - name: Verify Rust uses mold linker
        run: |
          printf 'fn main() {}\n' > /tmp/mold-link-check.rs
          rustc /tmp/mold-link-check.rs -o /tmp/mold-link-check
          readelf -p .comment /tmp/mold-link-check | grep -q mold
